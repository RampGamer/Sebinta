<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Sebinta</title>
<style>
  :root {
    --bg-chrome: #0c0e12;
    --bg-panel: #161922;
    --bg-panel-2: #1d2130;
    --border: #2a2f3d;
    --text: #e7e9ee;
    --text-dim: #9aa0b0;
    --accent: #5b8cff;
    --danger: #e05a5a;
    --success: #4caf7d;
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg-chrome); color: var(--text); font-family: var(--font);
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  .window-chrome {
    display: flex;
    align-items: stretch;
    background: var(--bg-chrome);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .host-btn {
    display: flex; align-items: center; justify-content: center;
    width: 44px; flex-shrink: 0;
    background: transparent; border: none; border-right: 1px solid var(--border);
    color: var(--text-dim); font-size: 1.05rem; cursor: pointer;
  }
  .host-btn:hover { background: var(--bg-panel-2); color: var(--text); }

  .tab-strip {
    display: flex; align-items: flex-end; gap: 0.2rem;
    padding: 0.4rem 0.4rem 0; flex: 1; min-width: 0; overflow: hidden;
  }
  .tab {
    display: flex; align-items: center; gap: 0.45rem;
    background: var(--bg-chrome); color: var(--text-dim);
    border: 1px solid var(--border); border-bottom: none;
    border-radius: 8px 8px 0 0;
    padding: 0.45rem 0.5rem 0.45rem 0.75rem;
    font-size: 0.8rem; white-space: nowrap; cursor: pointer;
    flex: 1 1 160px; max-width: 200px; min-width: 40px;
    position: relative; top: 1px;
  }
  .tab .name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
  .tab .dot.loading { background: var(--text-dim); }
  .tab .close {
    width: 16px; height: 16px; border-radius: 4px; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; font-size: 0.75rem; color: var(--text-dim);
  }
  .tab .close:hover { background: var(--danger); color: white; }
  .tab.active { background: var(--bg-panel); color: var(--text); border-color: var(--border); }
  .tab:not(.active):hover { background: #14171f; }
  .tab-new {
    flex-shrink: 0; width: 30px; height: 30px; margin: 0 0 0.4rem 0.15rem;
    border-radius: 7px; background: transparent; border: 1px solid transparent;
    color: var(--text-dim); font-size: 1rem; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .tab-new:hover { background: var(--bg-panel-2); border-color: var(--border); color: var(--text); }

  #tab-views { flex: 1; display: flex; min-height: 0; }
  .tab-view { flex: 1; display: none; min-height: 0; }
  .tab-view webview { width: 100%; height: 100%; display: flex; }

  /* ---------- tema "caderno": segue o easter egg da página ativa
     (ver btn-brand-logo em style.css e o listener 'ipc-message' em
     shell.js) — cromada da janela também vira papel/post-its. ---------- */
  @font-face {
    font-family: 'Caveat';
    font-weight: 700;
    font-style: normal;
    font-display: swap;
    src: url(../assets/fonts/caveat-700.ttf) format('truetype');
  }
  @font-face {
    font-family: 'Permanent Marker';
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    src: url(../assets/fonts/permanent-marker.ttf) format('truetype');
  }

  body.theme-notebook {
    --nb-desk: #1a1e28;
    --nb-ink: #23273a;
    --nb-ink-soft: #4a4f6b;
    --nb-highlight: #f3cf4e;
    --nb-margin: #bb4f3b;
    --nb-sticky-yellow: #f4dd86;
    --nb-sticky-mint: #a7d6c4;
    --nb-sticky-pink: #f0b6bd;
    --nb-font-marker: 'Permanent Marker', cursive;
    --nb-font-hand: 'Caveat', cursive;
    background: var(--nb-desk);
  }
  body.theme-notebook .window-chrome {
    background: var(--nb-desk);
    border-bottom: 2px dashed rgba(120, 150, 200, 0.35);
  }
  body.theme-notebook .host-btn {
    border-right: none;
    color: #9aa2b0;
    font-family: var(--nb-font-marker);
  }
  body.theme-notebook .host-btn:hover { color: var(--nb-highlight); background: rgba(255,255,255,0.06); }

  body.theme-notebook .tab {
    font-family: var(--nb-font-hand);
    font-weight: 700;
    font-size: 1.3rem;
    background: var(--nb-sticky-yellow);
    color: var(--nb-ink);
    border: none;
    opacity: 0.7;
    filter: saturate(0.7);
  }
  body.theme-notebook .tab:nth-child(3n+2) { background: var(--nb-sticky-mint); }
  body.theme-notebook .tab:nth-child(3n+3) { background: var(--nb-sticky-pink); }
  body.theme-notebook .tab:hover { opacity: 0.9; }
  body.theme-notebook .tab.active {
    opacity: 1;
    filter: none;
    box-shadow: 0 -5px 10px rgba(0,0,0,0.25);
  }
  body.theme-notebook .tab .dot.loading { background: var(--nb-ink-soft); }
  body.theme-notebook .tab .close { color: var(--nb-ink-soft); }
  body.theme-notebook .tab .close:hover { background: var(--nb-margin); color: #fff; }
  body.theme-notebook .tab-new {
    border: 2px dashed rgba(154, 162, 176, 0.5);
    color: #9aa2b0;
    font-family: var(--nb-font-marker);
  }
  body.theme-notebook .tab-new:hover { border-color: var(--nb-highlight); color: var(--nb-highlight); background: transparent; }
</style>
</head>
<body>
  <div class="window-chrome">
    <button class="host-btn" id="host-btn" title="Mudar servidor">⚙</button>
    <div class="tab-strip" id="tab-strip">
      <button class="tab-new" id="tab-new" title="Novo separador">+</button>
    </div>
  </div>
  <div id="tab-views"></div>
  <script src="shell.js"></script>
</body>
</html>

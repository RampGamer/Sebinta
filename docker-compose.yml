name: sebinta

services:
  app:
    build: .
    image: sebinta:latest
    restart: unless-stopped
    environment:
      - SITE_PASSWORD=${SITE_PASSWORD:-}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-500}
      - FILE_TTL_DAYS=${FILE_TTL_DAYS:-}
      - COOKIE_SECRET=${COOKIE_SECRET:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - sebinta_data:/app/data
      - sebinta_uploads:/app/uploads
    # Sem "ports": a app não é exposta diretamente na máquina. O único
    # acesso vem do serviço cloudflared, pela rede interna do Docker.
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Modo por omissão: "Quick Tunnel" — não precisa de conta Cloudflare nem
    # de TUNNEL_TOKEN, mas dá um URL aleatório *.trycloudflare.com que muda
    # sempre que o container reinicia (sem SLA, só para uso pessoal/testes).
    #
    # Para um túnel nomeado com URL fixo (recomendado para uso continuado):
    # 1. Segue os passos do README para obteres um TUNNEL_TOKEN.
    # 2. Define TUNNEL_TOKEN no .env.
    # 3. Substitui a linha "command" abaixo por: command: ["tunnel", "run"]
    #    (o cloudflared lê o token automaticamente da variável de ambiente
    #    TUNNEL_TOKEN, sem precisar de o passar como argumento).
    command: ["tunnel", "--url", "http://app:3000"]
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
    # Também sem "ports": o cloudflared só faz ligações de saída para a
    # rede da Cloudflare; o HTTPS público é tratado inteiramente por ela.

networks:
  internal:
    driver: bridge

volumes:
  sebinta_data:
  sebinta_uploads:
